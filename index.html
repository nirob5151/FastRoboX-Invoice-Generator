<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FastRoboX 1.0 · Invoice Desk</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#e9f1f6;--panel:#fff;--ink:#0a2540;--muted:#566b7f;--line:#d3dee8;--accent:#0f5db3;--cyan:#27c4e4;--danger:#b3261e}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#071a2e;--panel:#0f2a47;--ink:#e6f0f8;--muted:#9bb2c6;--line:#24435f;--accent:#5eb5ff;--danger:#ff8a80}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 "Barlow",system-ui,sans-serif}
h1,h2,h3{font-family:"Barlow Condensed","Arial Narrow",sans-serif;margin:0;text-transform:uppercase;letter-spacing:.5px}
button,input,textarea,select{font:inherit;color:inherit}
input,textarea,select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel)}
input:focus-visible,textarea:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--cyan);outline-offset:1px}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 3px}
.btn{background:var(--accent);color:#fff;border:0;border-radius:6px;padding:9px 16px;cursor:pointer;font-weight:500}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.cyan{background:var(--cyan);color:#06243d;font-weight:600}
[hidden]{display:none!important}

#login,#menu{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(160deg,#06233b 0%,#0b4a86 55%,#27c4e4 130%)}
.card{background:var(--panel);border-radius:12px;padding:28px;width:100%;max-width:390px}
.card .logos{display:flex;gap:10px;margin-bottom:14px}
.card .logos img{width:54px;height:54px;flex:none}
.card h1{font-size:34px;line-height:1}
.card p{color:var(--muted);margin:6px 0 12px}
#err{color:var(--danger);min-height:20px;margin:8px 0 0;font-size:14px}

header.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 22px;color:#fff;background:linear-gradient(90deg,#06233b,#0b4a86)}
header.top .brand{display:flex;align-items:center;gap:10px}
header.top img{width:38px;height:38px;flex:none}
header.top h2{font-size:22px}
header.top .btn{background:transparent;border:1px solid rgba(255,255,255,.6)}
#login,#menu{display:flex;flex-direction:column;justify-content:center;align-items:center;gap:22px}
.sp{display:block;width:100%;max-width:1000px;border-radius:8px}
.sp-wrap{max-width:1240px;margin:0 auto;padding:0 20px 24px}
.sp-wrap .sp{max-width:none}
.co-mini{display:flex;flex-direction:column;gap:4px;margin-left:auto;align-items:flex-end}
.co-mini .cap{font-size:12px;font-weight:600;color:var(--muted)}
.co-mini .row{display:flex;gap:6px}
.co-mini img{width:30px;height:30px;flex:none}
.hb{display:flex;gap:8px}
.choices{display:grid;gap:12px;margin-top:14px}
.choice{text-align:left;padding:16px 18px;border:1px solid var(--line);border-radius:10px;background:var(--panel);cursor:pointer;width:100%}
.choice:hover{border-color:var(--accent)}
.choice h3{font-size:24px;color:var(--accent)}
.choice p{margin:2px 0 0;color:var(--muted)}
.layout{display:grid;grid-template-columns:minmax(300px,430px) 1fr;gap:20px;padding:20px;max-width:1240px;margin:0 auto}
@media(max-width:860px){.layout{grid-template-columns:1fr}}
.form{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px;align-self:start}
.form h3{font-size:18px;color:var(--accent);margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.form h3:first-child{margin-top:0;padding-top:0;border:0}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pick{display:grid;grid-template-columns:1fr 70px auto;gap:8px;align-items:end}
.hint{font-size:12.5px;color:var(--muted);margin:6px 0 0}
.item{display:grid;grid-template-columns:1fr 52px 78px 26px;gap:6px;margin-bottom:6px}
.item button{background:none;border:0;color:var(--danger);cursor:pointer;font-size:18px}
.actions{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}

.paper{--o:#c8431a;--cream:#fff4ea;--tx:#2b303b;background:var(--cream);color:var(--tx);border-radius:4px;padding:36px;min-height:620px;overflow-x:auto;display:flex;flex-direction:column}
.paper .head{display:flex;justify-content:space-between;align-items:flex-start;gap:20px}
.paper .org{display:flex;gap:12px;align-items:center}
.paper .org img{width:54px;height:54px;flex:none}
.paper h1{font-family:"Barlow",Arial,sans-serif;font-weight:700;font-size:38px;line-height:1;letter-spacing:0;color:var(--o)}
.paper .ev{font-weight:500;margin-top:6px;font-size:14px}
.paper .meta{text-align:right;font-size:13px}
.paper .meta b{display:block;font-size:20px;font-weight:700;color:var(--o)}
.paper .lbl{display:block;font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--o);margin-bottom:4px}
.paper small{color:#6b6f7a;display:block}
.stamp{display:inline-block;margin-top:6px;padding:0 10px;border:2px solid;border-radius:3px;font-weight:700;font-size:13px;letter-spacing:1px;text-transform:uppercase}
.stamp.paid{color:#1b7f3b}.stamp.unpaid{color:var(--o)}
.co{margin-top:auto;padding-top:28px;align-self:flex-end;text-align:right}
.co .lbl{margin-bottom:6px}
.co div{display:flex;gap:6px;justify-content:flex-end}
.co img{width:32px;height:32px;flex:none}
.paper .parties{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:26px 0 30px}
.paper .parties b{font-size:16px}
.paper table{width:100%;border-collapse:collapse}
.paper th{text-align:left;font-size:12px;color:var(--o);font-weight:700;border-bottom:1px solid #e9cdb8;padding:8px 4px}
.paper td{padding:8px 4px;border-bottom:1px solid #f0dccb;vertical-align:top;font-size:14px}
.paper .r{text-align:right}
.totals{margin:14px 0 0 auto;width:280px}
.totals div{display:flex;justify-content:space-between;padding:3px 4px;font-size:14px}
.totals .grand{font-weight:700;font-size:16px;color:#fff;background:var(--o);padding:9px 12px;margin-top:8px}
.notes{margin-top:26px;white-space:pre-wrap;color:#6b6f7a;font-size:13px}

@media print{
  @page{margin:0}
  html,body{background:#fff6ee!important}
  header.top,.form,#login,#menu,.sp-wrap{display:none!important}
  .layout{display:block;padding:0;max-width:none;margin:0}
  .paper{border-radius:0;padding:16mm;min-height:297mm}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>

<section id="login">
  <div class="card">
    <div class="logos"><img data-logo="b" alt="BUBT"><img data-logo="i" alt="IEEE BUBT Student Branch"></div>
    <h1>FastRoboX 1.0<br>Invoice desk</h1>
    <p>Sign in to create registration invoices.</p>
    <label for="uid">User ID</label>
    <input id="uid" autocomplete="username">
    <label for="pw">Password</label>
    <input id="pw" type="password" autocomplete="current-password">
    <div id="err" role="alert"></div>
    <div class="actions"><button class="btn" id="go">Sign in</button><div class="co-mini" id="coLogin" aria-label="Co-organizers"></div></div>
  </div>
  <img class="sp" data-sp alt="Event partners">
</section>

<section id="menu" hidden>
  <div class="card" style="max-width:460px">
    <div class="logos"><img data-logo="b" alt=""><img data-logo="i" alt=""></div>
    <h1>What do you want to create?</h1>
    <div class="choices">
      <button class="choice" id="pickTeam"><h3>Team invoice</h3><p>Registration fees for a team's segments.</p></button>
      <button class="choice" id="pickPur"><h3>Event purchase invoice</h3><p>Items bought from a vendor for the event.</p></button>
    </div>
    <div class="actions"><button class="btn ghost" id="out2">Sign out</button><div class="co-mini" id="coMenu" aria-label="Co-organizers"></div></div>
  </div>
  <img class="sp" data-sp alt="Event partners">
</section>

<div id="app" hidden>
  <header class="top">
    <div class="brand"><img data-logo="b" alt=""><img data-logo="i" alt=""><h2>FastRoboX 1.0 · Invoice desk</h2></div>
    <div class="hb"><button class="btn" id="sw">Switch type</button><button class="btn" id="out">Sign out</button></div>
  </header>
  <div class="layout">
    <div class="form">
      <h3 id="partyH">Team</h3>
      <label for="clName" id="lName">Team name</label><input id="clName" placeholder="e.g. Team Voltage">
      <label for="clAddr" id="lAddr">Institution &amp; contact (name, phone, email)</label>
      <textarea id="clAddr" rows="3"></textarea>

      <div id="segBox"><h3>Add segment</h3>
      <div class="pick">
        <div><label for="seg">Segment</label><select id="seg"></select></div>
        <div><label for="mem">Members</label><input id="mem" type="number" min="1" value="3"></div>
        <button class="btn cyan" id="addSeg">Add</button>
      </div>
      <p class="hint" id="segHint"></p></div>

      <h3>Invoice</h3>
      <div class="row">
        <div><label for="invNo">Invoice no.</label><input id="invNo"></div>
        <div><label for="invDate">Issue date</label><input id="invDate" type="date"></div>
      </div>
      <div class="row">
        <div><label for="status">Payment status</label><select id="status"><option value="unpaid">Unpaid</option><option value="paid">Paid</option></select></div>
        <div><label for="trx">bKash / bank TrxID</label><input id="trx" placeholder="optional"></div>
      </div>

      <h3>Line items</h3>
      <div id="items"></div>
      <button class="btn ghost" id="add">Add custom item</button>
      <div class="row">
        <div><label for="disc">Discount (৳)</label><input id="disc" type="number" min="0" step="0.01" value="0"></div>
        <div><label for="tax">Tax %</label><input id="tax" type="number" min="0" step="0.01" value="0"></div>
      </div>
      <label for="notes">Notes</label>
      <textarea id="notes" rows="4"></textarea>

      <div class="actions">
        <button class="btn cyan" id="pdf">Download PDF</button>
        <button class="btn ghost" id="print">Print</button>
        <button class="btn ghost" id="next">New invoice</button>
      </div>
      <p class="hint">If Print does nothing (it is blocked inside some app previews), use Download PDF.</p>
    </div>

    <div class="paper" id="paper" aria-live="polite"></div>
  </div>
  <div class="sp-wrap"><img class="sp" data-sp alt="Event partners"></div>
</div>

  {n:"Poster Presentation",     base:1500, incl:3, extra:500,  kind:"main"},
  {n:"Project Showing (Junior)",base:1600, incl:4, extra:400,  kind:"main"},
  {n:"Project Showing (Senior)",base:1500, incl:3, extra:500,  kind:"main"},
  {n:"Olympiad (Class 9–10)",   base:0,    incl:1, extra:null, kind:"free"},
  {n:"Olympiad (Class 10–11)",  base:0,    incl:1, extra:null, kind:"free"},
  {n:"Treasure Hunt",           base:300,  incl:3, extra:null, kind:"hunt"}
];

async function sha256(t){
  const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(t));
  return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");
}
const $ = id => document.getElementById(id);
async function tryLogin(){
  const ok = $("uid").value.trim()===USER_ID && (await sha256($("pw").value))===PASS_HASH;
  if(ok){ try{sessionStorage.setItem("auth","1")}catch(e){} showMenu(); }
  else $("err").textContent = "ID or password is incorrect. Check both and try again.";
}
function showMenu(){ $("login").hidden=true; $("app").hidden=true; $("menu").hidden=false; }
function start(m){ mode=m; $("menu").hidden=true; $("app").hidden=false; setup(); }
function setup(){
  const pur = mode==="pur";
  $("segBox").hidden = pur;
  $("partyH").textContent = pur ? "Vendor" : "Team";
  $("lName").textContent = pur ? "Vendor / shop name" : "Team name";
  $("clName").placeholder = pur ? "e.g. Hi-Tech Electronics" : "e.g. Team Voltage";
  $("lAddr").textContent = pur ? "Vendor address & contact" : "Institution & contact (name, phone, email)";
  ["clName","clAddr","trx","notes"].forEach(i=>$(i).value="");
  $("status").value="unpaid"; $("disc").value=0; $("tax").value=0;
  counted = false;
  items = pur ? [{d:"",q:1,p:0}] : [];
  $("invNo").value=nextNo(); $("invDate").value=today();
  init();
}
["coMenu","coLogin"].forEach(id=>{ $(id).innerHTML = `<span class="cap">Co-organizers</span><div class="row">${CO.map(c=>`<img src="${c[1]}" alt="${c[0]}" title="IEEE BUBT ${c[0]}">`).join("")}</div>`; });
$("pickTeam").onclick = ()=>start("team");
$("pickPur").onclick  = ()=>start("pur");
$("sw").onclick = showMenu;
$("out2").onclick = ()=>$("out").onclick();
$("go").onclick = tryLogin;
$("pw").addEventListener("keydown", e=>{ if(e.key==="Enter") tryLogin(); });
$("out").onclick = ()=>{ try{sessionStorage.removeItem("auth")}catch(e){} location.reload(); };

/* ===== INVOICE ===== */
let items = [];
let mode = "team";
let counted = false;
const esc = s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const today = ()=>new Date().toISOString().slice(0,10);
const fmt = n => "৳ " + n.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});

const ckey = ()=> mode==="pur" ? "purCount" : "invCount";
function nextNo(){
  let n=1; try{ n=(+localStorage.getItem(ckey())||0)+1 }catch(e){}
  return (mode==="pur"?"PUR-":"FRX-") + String(n).padStart(3,"0");
}
function init(){
  if(!$("seg").options.length){
    $("seg").innerHTML = SEG.map((s,i)=>`<option value="${i}">${s.n}</option>`).join("");
    segChange();
  }
  if(!$("invNo").value){ $("invNo").value=nextNo(); $("invDate").value=today(); }
  renderItems(); render();
}
function segChange(){
  const s = SEG[$("seg").value]; $("mem").value = s.incl;
  $("segHint").textContent =
    s.kind==="iot"  ? "৳2,600 per team, 1–5 members." :
    s.kind==="free" ? "Free entry." :
    s.kind==="hunt" ? "৳300 for 3 members. Free if the team has any main segment (not IoT Hackathon)." :
    `৳${s.base.toLocaleString()} for up to ${s.incl} members, then +৳${s.extra} per extra member.`;
}
$("seg").onchange = segChange;

$("addSeg").onclick = () => {
  const s = SEG[$("seg").value], m = Math.max(1, parseInt($("mem").value)||1);
  const tag = ` (${m} member${m>1?"s":""})`;
  if(s.kind==="hunt") items.push({d:"Treasure Hunt"+tag, q:1, p:300, k:"hunt", a:true});
  else if(s.kind==="free") items.push({d:s.n+" — free"+tag, q:1, p:0, k:"free"});
  else {
    items.push({d:s.n+tag, q:1, p:s.base, k:s.kind});
    if(s.extra!==null && m>s.incl) items.push({d:s.n+" — extra members (beyond "+s.incl+")", q:m-s.incl, p:s.extra, k:"x"});
    if(s.kind==="iot" && m>5) $("segHint").textContent="IoT Hackathon allows at most 5 members per team.";
  }
  applyHunt(); renderItems(); render();
};
function applyHunt(){
  const hasMain = items.some(i=>i.k==="main");
  items.forEach(i=>{ if(i.k==="hunt" && i.a){ i.p = hasMain?0:300; i.d = i.d.replace(/ — free entry/,"") + (hasMain?" — free entry":""); } });
}
function renderItems(){
  $("items").innerHTML = items.map((it,i)=>`
    <div class="item">
      <input data-i="${i}" data-k="d" value="${esc(it.d)}" aria-label="Description">
      <input data-i="${i}" data-k="q" type="number" min="0" value="${it.q}" aria-label="Quantity">
      <input data-i="${i}" data-k="p" type="number" min="0" step="0.01" value="${it.p}" aria-label="Unit price">
      <button data-del="${i}" aria-label="Remove item">×</button>
    </div>`).join("");
}
$("items").addEventListener("input", e=>{
  const t=e.target, i=t.dataset.i; if(i===undefined) return;
  items[i][t.dataset.k] = t.dataset.k==="d" ? t.value : (parseFloat(t.value)||0);
  if(t.dataset.k==="p") items[i].a=false;
  render();
});
$("items").addEventListener("click", e=>{
  if(e.target.dataset.del!==undefined){ items.splice(+e.target.dataset.del,1); applyHunt(); renderItems(); render(); }
});
$("add").onclick = ()=>{ items.push({d:"",q:1,p:0}); renderItems(); render(); };
document.querySelector(".form").addEventListener("input", render);

function render(){
  const sub = items.reduce((s,i)=>s+i.q*i.p,0);
  const disc = Math.min(parseFloat($("disc").value)||0, sub);
  const tax = (sub-disc)*(parseFloat($("tax").value)||0)/100;
  const total = sub-disc+tax;
  const line = s=>esc(s).replace(/\n/g,"<br>");
  const paid = $("status").value==="paid", pur = mode==="pur";
  const who = `<b>${esc($("clName").value||"—")}</b><br>${line($("clAddr").value)}`;
  $("paper").innerHTML = `
    <div class="head">
      <div class="org"><img src="${LOGO_B}" alt=""><img src="${LOGO_I}" alt="">
        <div><h1>${pur?"Purchase Invoice":"Invoice"}</h1><div class="ev">${esc(EVENT)}</div><small>${esc(WHEN)}</small></div></div>
      <div class="meta"><b>${esc($("invNo").value)}</b>Issued ${esc($("invDate").value)}
        <div><span class="stamp ${paid?"paid":"unpaid"}">${paid?"Paid":"Unpaid"}</span></div>
        ${$("trx").value?`<small>TrxID: ${esc($("trx").value)}</small>`:""}</div>
    </div>
    <div class="parties">
      <div><span class="lbl">From</span>${pur?who:line(FROM)}</div>
      <div><span class="lbl">Bill to</span>${pur?line(FROM):who}</div>
    </div>
    <table>
      <tr><th>Description</th><th class="r">Qty</th><th class="r">Price</th><th class="r">Amount</th></tr>
      ${items.length?items.map(i=>`<tr><td>${esc(i.d)}</td><td class="r">${i.q}</td><td class="r">${fmt(i.p)}</td><td class="r">${fmt(i.q*i.p)}</td></tr>`).join(""):`<tr><td colspan="4" style="color:#566b7f">Add an item to start the invoice.</td></tr>`}
    </table>
    <div class="totals">
      <div><span>Subtotal</span><span>${fmt(sub)}</span></div>
      ${disc?`<div><span>Discount</span><span>− ${fmt(disc)}</span></div>`:""}
      ${tax?`<div><span>Tax (${esc($("tax").value)}%)</span><span>${fmt(tax)}</span></div>`:""}
      <div class="grand"><span>Total</span><span>${fmt(total)}</span></div>
    </div>
    <div class="notes">${esc($("notes").value)}</div>
    <div class="co"><span class="lbl">Co-organizers</span><div>${CO.map(c=>`<img src="${c[1]}" alt="${c[0]}">`).join("")}</div></div>`;
}

const bump = ()=>{ if(counted) return; counted=true; try{ localStorage.setItem(ckey(), (+localStorage.getItem(ckey())||0)+1) }catch(e){} };
const fname = ()=>($("invNo").value+" - "+($("clName").value||"Invoice")).replace(/[\\\/:*?"<>|]+/g,"");
$("print").onclick = ()=>{
  bump(); document.title = fname();
  try{ window.print(); }catch(e){ alert("Printing is blocked here. Use Download PDF instead."); }
};
$("pdf").onclick = async ()=>{
  if(!window.html2canvas || !window.jspdf){ alert("The PDF tool could not load. Check your internet connection and try again."); return; }
  const btn=$("pdf"); btn.disabled=true; btn.textContent="Preparing…";
  let box;
  try{
    render();
    box=document.createElement("div");
    box.style.cssText="position:fixed;left:-10000px;top:0;width:794px;";
    const c=$("paper").cloneNode(true); c.removeAttribute("id");
    c.style.cssText="width:794px;min-height:1123px;padding:48px;border-radius:0;overflow:visible";
    box.appendChild(c); document.body.appendChild(box);
    const cv=await html2canvas(c,{scale:2,backgroundColor:"#fff4ea",useCORS:true});
    const pdf=new window.jspdf.jsPDF({unit:"mm",format:"a4"});
    const img=cv.toDataURL("image/jpeg",0.95), h=210*cv.height/cv.width, pages=Math.max(1,Math.ceil((h-1)/297));
    for(let i=0;i<pages;i++){
      if(i) pdf.addPage();
      pdf.setFillColor(255,244,234); pdf.rect(0,0,210,297,"F");
      pdf.addImage(img,"JPEG",0,-i*297,210,h);
    }
    pdf.save(fname()+".pdf"); bump();
  }catch(e){ alert("Could not create the PDF. Try Print instead."); }
  finally{ if(box) box.remove(); btn.disabled=false; btn.textContent="Download PDF"; }
};
$("next").onclick = setup;
try{ if(sessionStorage.getItem("auth")==="1") showMenu(); }catch(e){}
</script>
</body>
